<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>スマッシュフェスタ リーグ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
:root{
  --bg:#fbf6fb;--surface:#ffffff;--ink:#3a2a3f;--muted:#8a7690;--line:#eadcee;
  --pink:#e8456b;--sky:#4aa8dc;--lemon:#f6c945;--win:#2e9e6a;--lose:#c7485f;--cell:#f4ecf6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#1d1620;--surface:#281f2c;--ink:#f3e8f5;--muted:#b09ab6;--line:#3d3042;
  --pink:#ff6f92;--sky:#6cc1ef;--lemon:#f6d267;--win:#5fcf97;--lose:#ff7f95;--cell:#33283a;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#1d1620;--surface:#281f2c;--ink:#f3e8f5;--muted:#b09ab6;--line:#3d3042;
  --pink:#ff6f92;--sky:#6cc1ef;--lemon:#f6d267;--win:#5fcf97;--lose:#ff7f95;--cell:#33283a;}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:28px}
h1,h2{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;line-height:1.25}
h1 span{color:var(--pink)}
h2{font-size:18px;font-weight:800;margin-bottom:10px}
.sub{color:var(--muted);margin:4px 0 0;font-size:13px}
.status{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
td.name{text-align:left;font-weight:700}
.rank{font-family:"M PLUS Rounded 1c",sans-serif;font-weight:800;font-size:18px}
tr.r1 .rank{color:var(--pink)} tr.r2 .rank{color:var(--sky)} tr.r3 .rank{color:var(--lemon)}
.pts{font-weight:700;font-size:17px}
.grid td.self{background:var(--cell)}
.grid td.res{cursor:pointer}
.grid td.res:hover{background:var(--cell)}
.w{color:var(--win);font-weight:700}.l{color:var(--lose);font-weight:700}.tbd{color:var(--muted)}
.matches{display:grid;gap:10px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.match .p{flex:1 1 90px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.match .p.right{text-align:right}
.match input{width:52px;font:inherit;font-size:18px;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.match .vs{color:var(--muted);font-size:12px}
.match.done{border-color:color-mix(in srgb,var(--pink) 40%,var(--line))}
button{font:inherit;font-weight:700;border-radius:999px;padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--pink);border-color:var(--pink);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.players input{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rule{font-size:13px;color:var(--muted);margin:8px 0 0}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>サンリオ スマッシュフェスタ<br><span>フレンズリーグ</span></h1>
    <p class="sub">4人総当たり・全6試合 <span class="status" id="status">· 読み込み中…</span></p>
  </header>
  <section>
    <h2>順位表</h2>
    <div class="scroll"><table id="standings"></table></div>
    <p class="rule">勝ち=3pt・引き分け=1pt。同点は 得失差 → 得点 → 直接対決 の順。</p>
  </section>
  <section>
    <h2>対戦表</h2>
    <div class="scroll"><table class="grid" id="grid"></table></div>
    <p class="rule">行のプレイヤーから見た結果（○勝ち ●負け △引き分け）。</p>
  </section>
  <section>
    <h2>試合一覧</h2>
    <div class="matches" id="matches"></div>
  </section>
  <section id="editor" hidden>
    <h2>結果を入力（管理者用）</h2>
    <div class="players" id="tokenBox">
      <input id="token" type="password" autocomplete="off" placeholder="GitHubトークン（初回のみ）" aria-label="GitHubトークン">
    </div>
    <div class="matches" id="inputs" style="margin-top:10px"></div>
    <p class="rule">両方空欄で未消化に戻ります。保存後、公開ページへの反映は1〜2分かかります。</p>
    <div class="row"><button class="primary" id="save">GitHubに保存</button><button id="forget">トークンを消す</button><span class="status" id="msg"></span></div>
  </section>
</div>
<script>
const PAIRS=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
let state={players:["プレイヤーA","プレイヤーB","プレイヤーC","プレイヤーD"],results:{}};
const $=id=>document.getElementById(id);
const key=(a,b)=>a+"-"+b;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function scoreOf(a,b){const r=state.results[key(Math.min(a,b),Math.max(a,b))];if(!r)return null;return a<b?[r[0],r[1]]:[r[1],r[0]]}
function h2h(a,b){const s=scoreOf(a,b);return s?s[0]-s[1]:0}
function standings(){
  const rows=state.players.map((n,i)=>({i,n,p:0,w:0,d:0,l:0,gf:0,ga:0,gp:0}));
  PAIRS.forEach(([a,b])=>{const s=scoreOf(a,b);if(!s)return;const A=rows[a],B=rows[b];A.gp++;B.gp++;A.gf+=s[0];A.ga+=s[1];B.gf+=s[1];B.ga+=s[0];
    if(s[0]>s[1]){A.w++;A.p+=3;B.l++}else if(s[0]<s[1]){B.w++;B.p+=3;A.l++}else{A.d++;B.d++;A.p++;B.p++}});
  return rows.sort((x,y)=>y.p-x.p||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||h2h(y.i,x.i));
}
function render(){
  $("standings").innerHTML=`<tr><th>順位</th><th style="text-align:left">プレイヤー</th><th>試合</th><th>勝</th><th>分</th><th>敗</th><th>得失差</th><th>Pt</th></tr>`+
    standings().map((r,k)=>{const d=r.gf-r.ga;return `<tr class="r${k+1}"><td class="rank">${k+1}</td><td class="name">${esc(r.n)}</td><td>${r.gp}/3</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${d>0?"+":""}${d}</td><td class="pts">${r.p}</td></tr>`}).join("");
  const P=state.players;
  $("grid").innerHTML=`<tr><th></th>${P.map(n=>`<th>${esc(n)}</th>`).join("")}</tr>`+P.map((n,a)=>`<tr><td class="name">${esc(n)}</td>${P.map((_,b)=>{
    if(a===b)return `<td class="self">—</td>`;const s=scoreOf(a,b);if(!s)return `<td class="tbd">未</td>`;
    const c=s[0]>s[1]?"w":s[0]<s[1]?"l":"";return `<td class="${c}">${s[0]>s[1]?"○":s[0]<s[1]?"●":"△"} ${s[0]}-${s[1]}</td>`}).join("")}</tr>`).join("");
  $("matches").innerHTML=PAIRS.map(([a,b],i)=>{const r=state.results[key(a,b)];
    return `<div class="match${r?" done":""}"><span class="vs">第${i+1}試合</span><span class="p right">${esc(P[a])}</span><span class="pts">${r?r[0]+" - "+r[1]:"未消化"}</span><span class="p">${esc(P[b])}</span></div>`}).join("");
}

const REPO="tanidayuya/sanrio-smash-league",FILE="league.json",TK="ssl_token";
const getTok=()=>{try{return localStorage.getItem(TK)||""}catch(e){return ""}};
const setTok=v=>{try{v?localStorage.setItem(TK,v):localStorage.removeItem(TK)}catch(e){}};
function renderInputs(){
  $("tokenBox").hidden=!!getTok();
  $("inputs").innerHTML=PAIRS.map(([a,b],i)=>{const r=state.results[key(a,b)];
    return `<div class="match"><span class="vs">第${i+1}試合</span><span class="p right">${esc(state.players[a])}</span>
    <input id="s${i}a" inputmode="numeric" aria-label="第${i+1}試合 ${esc(state.players[a])}" value="${r?r[0]:""}"><span class="vs">-</span>
    <input id="s${i}b" inputmode="numeric" aria-label="第${i+1}試合 ${esc(state.players[b])}" value="${r?r[1]:""}"><span class="p">${esc(state.players[b])}</span></div>`}).join("");
}
const b64=str=>btoa(String.fromCharCode(...new TextEncoder().encode(str)));
async function saveToGitHub(){
  const tok=$("token").value.trim()||getTok();
  if(!tok){$("msg").textContent="トークンを入れてください";return}
  const results={};
  for(let i=0;i<PAIRS.length;i++){const [a,b]=PAIRS[i];const va=$("s"+i+"a").value.trim(),vb=$("s"+i+"b").value.trim();
    if(va===""&&vb==="")continue;const na=+va,nb=+vb;
    if(!(Number.isInteger(na)&&Number.isInteger(nb)&&na>=0&&nb>=0&&na<100)){$("msg").textContent=`第${i+1}試合のスコアを数字で入れてください`;return}
    results[key(a,b)]=[na,nb];}
  const updated=new Date().toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  const next={players:state.players,results,updated};
  const api=`https://api.github.com/repos/${REPO}/contents/${FILE}`;
  const h={Authorization:"Bearer "+tok,Accept:"application/vnd.github+json"};
  $("save").disabled=true;$("msg").textContent="保存中…";
  try{
    const cur=await fetch(api+"?ref=main",{headers:h,cache:"no-store"});
    if(cur.status===401)throw new Error("トークンが無効です");
    if(!cur.ok)throw new Error("読み込み失敗 ("+cur.status+")");
    const {sha}=await cur.json();
    const res=await fetch(api,{method:"PUT",headers:h,body:JSON.stringify({message:"結果を更新 "+updated,content:b64(JSON.stringify(next,null,2)+"\n"),sha,branch:"main"})});
    if(res.status===401||res.status===403)throw new Error("書き込み権限がありません（トークンの権限を確認）");
    if(!res.ok)throw new Error("保存失敗 ("+res.status+")");
    setTok(tok);$("token").value="";
    state.results=results;state.updated=updated;render();renderInputs();
    $("msg").textContent="保存しました。公開ページには1〜2分で反映されます";
  }catch(e){$("msg").textContent=e.message}
  finally{$("save").disabled=false}
}
function initEditor(){
  if(location.hash!=="#edit")return;
  $("editor").hidden=false;renderInputs();
  $("save").addEventListener("click",saveToGitHub);
  $("forget").addEventListener("click",()=>{setTok("");renderInputs();$("msg").textContent="トークンを消しました"});
}
render();
fetch("league.json",{cache:"no-store"}).then(r=>r.json()).then(d=>{
  if(Array.isArray(d.players)&&d.players.length===4)state.players=d.players.map(String);
  const res={};PAIRS.forEach(([a,b])=>{const v=d.results?.[key(a,b)];if(Array.isArray(v)&&v.length===2&&v.every(Number.isFinite))res[key(a,b)]=v});
  state.results=res;render();state.updated=d.updated||"";$("status").textContent=d.updated?"· 最終更新 "+d.updated:"";initEditor();
}).catch(()=>{$("status").textContent="· 結果データを読み込めませんでした"});
window.addEventListener("hashchange",()=>location.reload());
</script>
</body></html>
